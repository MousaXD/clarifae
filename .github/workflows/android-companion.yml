name: Android companion APK
on:
  push:
    branches: [main, 'feat/android-companion-external-mic-validation']
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-companion.yml'
  pull_request:
    paths:
      - 'android-companion/**'
      - '.github/workflows/android-companion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile and lint
        working-directory: android-companion
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clarifae-mic-test-debug
          path: android-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
